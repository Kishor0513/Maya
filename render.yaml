# One-click free hosting on Render: static frontend + Node gateway.
# Render Dashboard → New → Blueprint → pick this repo, then fill the two
# prompted secrets (UPSTREAM_KEY = your Gemini key, GATEWAY_TOKEN = any
# random string pasted in BOTH places). Rename services freely — but keep
# the two URLs below in sync with the names you choose.
services:
  # Brain + API + memory. Free tier sleeps when idle: the first request
  # after sleep takes ~30-60s to wake, then it's instant. Serves the app
  # too (SERVE_DIR is baked into the image), so this URL alone also works.
  - type: web
    name: maya-gateway
    runtime: docker
    plan: free
    envVars:
      - key: UPSTREAM_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: UPSTREAM_MODEL
        value: gemini-3.6-flash
      - key: UPSTREAM_KEY
        sync: false # paste your Gemini key (aistudio.google.com) at deploy time
      - key: GATEWAY_TOKEN
        sync: false # paste any random string; reuse it as VITE_GATEWAY_TOKEN below
      - key: ALLOWED_ORIGIN
        value: https://maya-app.onrender.com

  # Static frontend. Free forever, never sleeps.
  - type: web
    name: maya-app
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://maya-gateway.onrender.com
      - key: VITE_GATEWAY_TOKEN
        sync: false # paste the SAME string as GATEWAY_TOKEN above
